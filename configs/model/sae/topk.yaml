# @package model
# TopK SAE configuration
# Keeps top k activations per sample

sae_encoder:
  _target_: steerable_retrieval.models.sae.encoders.TopKSAEEncoder
  act_size: 512  # Input feature dimension (audio + text concatenated)
  dict_size: 4096  # Dictionary size (number of features)
  top_k: 100  # Number of top activations to keep per sample
  input_unit_norm: true
  seed: null
  concat_dim: -1

sae_decoder:
  _target_: steerable_retrieval.models.sae.decoders.SAEDecoder
  dict_size: 4096  # Must match sae_encoder.dict_size
  act_size: 512  # Must match sae_encoder.act_size
  input_unit_norm: true
  seed: null

# penalty:
#   _target_: steerable_retrieval.models.sae.penalties.TopKPenalty
#   top_k: ${model.sae_encoder.top_k}

loss_fn:
  _target_: steerable_retrieval.models.utils.losses.TopKSAELoss
  l1_coeff: 0
  l2_coeff: 1.0
  aux_penalty: 0.1  # Auxiliary loss coefficient for dead features
  top_k_aux: 256  # Top k for auxiliary loss
  n_batches_to_dead: 128  # Number of batches before feature is considered dead
