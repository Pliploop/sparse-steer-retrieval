# @package model
# BatchTopK SAE configuration (Bussmann et al., 2024)
# Retains top-k global activations across batch; running threshold for eval.

sae_encoder:
  _target_: steerable_retrieval.models.sae.encoders.BatchTopKSAEEncoder
  act_size: 512  # Input feature dimension
  dict_size: 4096  # Dictionary size (number of features)
  top_k: 5  # Number of top activations to keep across batch
  threshold_momentum: 0.9  # EMA momentum for running threshold
  input_unit_norm: true

sae_decoder:
  _target_: steerable_retrieval.models.sae.decoders.SAEDecoder
  dict_size: 4096  # Must match sae_encoder.dict_size
  act_size: 512  # Must match sae_encoder.act_size
  input_unit_norm: true
  output_unit_norm: true

loss_fn:
  _target_: steerable_retrieval.models.utils.losses.TopKSAELoss
  l1_coeff: 0
  l2_coeff: 1.0
  aux_penalty: 0.05  # Auxiliary loss coefficient for dead features
  top_k_aux: 512  # Top k for auxiliary loss
  n_batches_to_dead: 128  # Number of batches before feature is considered dead
  orthogonal_loss: 0
