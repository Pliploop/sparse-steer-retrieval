# @package _global_

defaults:
  - _self_
  - /model: default
  - /data: default
  - concepts_experiment: extract
  - /paths: default
  - /trainer: default
  - /hydra: default
  - /dora: default
  - optional /local: default
  - /debug: null

task_name: "concept_isolation_processing"
seed: 42
device: cuda:0
run_name: "concept_isolation_processing"

output_dir: ${paths.output_dir}
dataset_stage: val  # train | val | test
max_batches: null

model_source:
  run_id: null             # Preferred: training run id (used to resolve the checkpoint)
  config_source: null      # Backward-compat: W&B run id OR .yaml path (local or s3://...) used to fetch cfg.model
  checkpoint_source: null  # Optional local/S3 checkpoint path; if null and run_id is set, auto-resolve latest from S3
  checkpoint_s3_prefix: s3://your-bucket/checkpoints

model_post_overrides: {}

concepts:
  vocab_path: ${paths.data_dir}/vocab.txt

